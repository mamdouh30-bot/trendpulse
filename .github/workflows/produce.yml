# ============================================================
#  TrendPulse — GitHub Actions autonomous producer (free hosting)
#  Publishes every 12 hours (09:00 & 21:00 Asia/Dubai) and NEVER
#  stops: two extra catch-up slots (15:00 & 03:00 Dubai) resume
#  any cycle that failed earlier, and every slot retries a failed
#  cycle 3 times in-job. Only small state JSON is committed back
#  so the next run can resume where it stopped.
# ============================================================

name: TrendPulse Production

on:
  schedule:
    - cron: "0 5,11,17,23 * * *"  # 09:00/15:00/21:00/03:00 Dubai — 2 publishes + 2 catch-up slots
  workflow_dispatch: {}           # manual "Run workflow" button

permissions:
  contents: write                 # needed to commit checkpoints back

concurrency:
  group: trendpulse
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system + python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Write .env from repository secrets
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TRENDPULSE_EDGE_VOICE: ${{ secrets.TRENDPULSE_EDGE_VOICE }}
        run: |
          set -e
          : > .env
          for var in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN YT_API_KEY \
                     LLM_API_KEY LLM_BASE_URL LLM_MODEL TAVILY_API_KEY \
                     SERPER_API_KEY BRAVE_API_KEY PEXELS_API_KEY \
                     PIXABAY_API_KEY ELEVENLABS_API_KEY TRENDPULSE_EDGE_VOICE; do
            val="${!var}"
            if [ -n "$val" ]; then echo "$var=$val" >> .env; fi
          done
          echo "TRENDPULSE_FAST_RENDER=1" >> .env
          chmod 600 .env
          echo ".env written with $(grep -c '=' .env || true) entries"

      - name: Run production cycle (3 self-heal attempts)
        id: cycle
        run: |
          set +e
          rc=1
          for i in 1 2 3; do
            echo "=== TrendPulse attempt $i/3 ==="
            python3 run_cycle.py
            rc=$?
            if [ $rc -eq 0 ]; then break; fi
            echo "attempt $i failed (rc=$rc) — cooling down 90s, then retrying"
            sleep 90
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit checkpoints back to the repo
        if: always()
        run: |
          git config user.name "trendpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "TrendPulse auto-run $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]" \
            || echo "nothing to commit"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
          git push

      - name: Fail loudly if production did not complete
        if: always()
        run: |
          rc="${{ steps.cycle.outputs.rc }}"
          if [ "$rc" != "0" ]; then
            echo "::error::production cycle failed after 3 attempts (rc=$rc) — next catch-up slot will resume it automatically"
            exit 1
          fi
