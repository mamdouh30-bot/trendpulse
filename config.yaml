# ============================================================
#  AI Money — Autonomous AI News Digest Agency
#  Format: broadcast-style digest with fixed host persona
#  ("Adam Sterling"), real linked sources, twice a day.
#  Portable configuration (GitHub Actions / Docker / VPS)
# ============================================================

channel:
  name: AI Money
  tagline: "The AI stories that matter — and how to profit from them."
  badge_text: AI MONEY            # shown on thumbnails + intro cards

persona:
  name: Adam Sterling
  role: HOST
  shots_dir: assets/persona       # committed studio shots (z-ai generated)
  intro_shot: host_intro.png      # desk wide shot -> episode intro
  bridge_shots:                   # rotating shots at every story start
    - host_talk_a.png
    - host_talk_b.png
    - host_point_r.png
    - host_desk.png
  cutaway_shot: host_closeup.png  # mid-story presence cutaway
  outro_shot: host_outro.png      # subscribe outro
  thumb_shot: host_thumb.png      # square portrait for thumbnails

content:
  niche: ai_news_tools_money      # AI news, new tools, money opportunities
  language: en                    # videos are produced in English
  format: digest                  # digest = N stories per video
  target_minutes: 14.0            # final video target duration
  word_budget: 2200               # narration words (~150 wpm host voice)
  chapters: 4                     # stories per digest video
  intro_scene: true               # FIXED branded intro + subscribe CTA every episode
  hook_scenes: 3                  # cold-open scenes
  outro_scenes: 2                 # recap + subscribe scenes
  scenes_per_story: 9             # narration scenes per digest story
  min_scenes: 30
  max_scenes: 44
  scene_pad: 0.8                  # seconds of breathing room after narration
  xfade: 0.6                      # crossfade seconds between scenes
  host_cutaway_every: 7           # one host cutaway every N scenes

voice:
  provider: auto                  # auto | elevenlabs | edge
                                  # auto = ElevenLabs if key+quota, else edge-tts
  speed: 1.0                      # 1.0 = natural energetic pace
  edge_voice: en-US-AndrewMultilingualNeural   # free fallback (upbeat US male)
  elevenlabs:
    voice_id: TxGEqnHWrfWFTfGW9XjX   # Josh — energetic young American host
    model: eleven_multilingual_v2
    stability: 0.42
    similarity_boost: 0.80
    style: 0.45

visuals:
  width: 1920
  height: 1080
  fps: 30                         # broadcast-smooth motion
  search_count: 8                  # images fetched per visual query
  per_chapter_queries: 3           # real-photo searches per story
  ai_fallback: true                # free AI image (Pollinations) if search fails
  tool_cards: true                 # branded product cards for named tools

motion:
  enabled: true                    # real B-roll footage stage (lib/footage)

footage:
  per_chapter_clips: 12            # unique moving clips fetched per story
  per_query_results: 8
  providers: [pexels, pixabay, mixkit, coverr, wikimedia, nasa]
  history_file: state/clip_history.json   # clips used by past episodes — never repeat
  history_max: 4000
  credit: "Stock footage: Mixkit / Coverr / Pexels / Pixabay / Wikimedia Commons (CC) / NASA (public domain) — free licenses"

links:
  subscribe_url: "https://www.youtube.com/@aimoneytested?sub_confirmation=1"
  channel_url: "https://www.youtube.com/@aimoneytested"
  # official destinations auto-added to the description when the story
  # mentions the tool (case-insensitive word match)
  tools:
    chatgpt:      {url: "https://chatgpt.com",           label: "ChatGPT"}
    openai:       {url: "https://openai.com",            label: "OpenAI"}
    sora:         {url: "https://sora.chatgpt.com",      label: "Sora"}
    gemini:       {url: "https://gemini.google.com",     label: "Google Gemini"}
    notebooklm:   {url: "https://notebooklm.google.com", label: "NotebookLM"}
    grok:         {url: "https://grok.com",              label: "Grok"}
    claude:       {url: "https://claude.ai",             label: "Claude"}
    anthropic:    {url: "https://www.anthropic.com",     label: "Anthropic"}
    deepseek:     {url: "https://chat.deepseek.com",     label: "DeepSeek"}
    llama:        {url: "https://www.llama.com",         label: "Llama"}
    meta:         {url: "https://ai.meta.com",           label: "Meta AI"}
    midjourney:   {url: "https://www.midjourney.com",    label: "Midjourney"}
    runway:       {url: "https://runwayml.com",          label: "Runway"}
    elevenlabs:   {url: "https://elevenlabs.io",         label: "ElevenLabs"}
    suno:         {url: "https://suno.com",              label: "Suno"}
    udio:         {url: "https://www.udio.com",          label: "Udio"}
    heygen:       {url: "https://www.heygen.com",        label: "HeyGen"}
    synthesia:    {url: "https://www.synthesia.io",      label: "Synthesia"}
    capcut:       {url: "https://www.capcut.com",        label: "CapCut"}
    canva:        {url: "https://www.canva.com",         label: "Canva"}
    notion:       {url: "https://www.notion.com",        label: "Notion"}
    perplexity:   {url: "https://www.perplexity.ai",     label: "Perplexity"}
    copilot:      {url: "https://github.com/features/copilot", label: "GitHub Copilot"}
    huggingface:  {url: "https://huggingface.co",        label: "Hugging Face"}
    nvidia:       {url: "https://www.nvidia.com",        label: "NVIDIA"}
    groq:         {url: "https://groq.com",              label: "Groq"}
    mistral:      {url: "https://mistral.ai",            label: "Mistral"}
    cohere:       {url: "https://cohere.com",            label: "Cohere"}
    stability:    {url: "https://stability.ai",          label: "Stability AI"}
    firefly:      {url: "https://firefly.adobe.com",     label: "Adobe Firefly"}
    veo:          {url: "https://labs.google/flow",      label: "Google Veo"}

music:
  provider: bundled               # bundled = real CC-BY tracks in assets/music
  track: assets/music/electrodoodle.mp3
  credit: 'Music: "Electrodoodle" by Kevin MacLeod (incompetech.com) — CC BY 4.0'
  base_gain: 0.13                 # music volume under narration (pre-duck)
  duck_db: 9.0                    # sidechain-style ducking depth
  sfx_gain: 0.30                  # whoosh/boom volume
  chapter_boom: true              # deep boom at every story start

upload:
  enabled: true                    # auto-upload when credentials exist in .env
  privacy: public                  # public | unlisted | private
  category_id: "28"                # 28 = Science & Technology (AI news niche)
  notify_on_pending: true          # keep video in outbox if credentials are missing

trend_discovery:
  queries:
    - "AI news today {month_year}"
    - "new AI model release announcement {month_year}"
    - "new AI tools and apps launched this week {month_year}"
    - "OpenAI Anthropic Google DeepMind Meta announcement {month_year}"
    - "AI startup funding and acquisition news {month_year}"
    - "make money with AI new tools and opportunities {month_year}"
  research_queries: 2              # verification searches per digest story
  history_file: state/history.json # topic memory to avoid repeats
