# ============================================================
#  AI Money — Autonomous AI News Digest Agency
#  Format: Matt-Wolfe-style AI news digest, outproduced:
#  every 12h, money angle on every story, tight 14-min cut.
#  Portable configuration (GitHub Actions / Docker / VPS)
# ============================================================

channel:
  name: AI Money
  tagline: "The AI stories that matter — and how to profit from them."
  badge_text: AI MONEY            # shown on thumbnails + intro cards

content:
  niche: ai_news_tools_money      # AI news, new tools, money opportunities
  language: en                    # videos are produced in English
  format: digest                  # digest = N stories per video (Matt Wolfe style)
  target_minutes: 14.0            # final video target duration
  word_budget: 2200               # narration words (~150 wpm host voice)
  chapters: 4                     # stories per digest video
  hook_scenes: 3                  # cold-open scenes
  outro_scenes: 2                 # recap + subscribe scenes
  scenes_per_story: 9             # narration scenes per digest story
  min_scenes: 30
  max_scenes: 44
  scene_pad: 0.8                  # seconds of breathing room after narration
  xfade: 0.6                      # crossfade seconds between scenes

voice:
  provider: auto                  # auto | elevenlabs | edge
                                  # auto = ElevenLabs if key+quota, else edge-tts
  speed: 1.0                      # 1.0 = natural energetic pace
  edge_voice: en-US-AndrewMultilingualNeural   # free fallback (upbeat US male)
  elevenlabs:
    voice_id: TxGEqnHWrfWFTfGW9XjX   # Josh — energetic young American host
    model: eleven_multilingual_v2
    stability: 0.42
    similarity_boost: 0.80
    style: 0.45

visuals:
  width: 1920
  height: 1080
  fps: 24
  search_count: 8                  # images fetched per visual query
  per_chapter_queries: 3           # real-photo searches per story
  ai_fallback: true                # free AI image (Pollinations) if search fails

motion:
  enabled: true                    # animated AI clips — auto-skipped on hosts
  max_clips: 7                     #   without a video provider (Ken Burns used)
  duration: 5

music:
  enabled: true
  base_gain: 0.16                  # music volume under narration
  sfx_gain: 0.30                   # whoosh/boom volume
  chapter_boom: true               # deep boom at every story start

upload:
  enabled: true                    # auto-upload when credentials exist in .env
  privacy: public                  # public | unlisted | private
  category_id: "28"                # 28 = Science & Technology (AI news niche)
  notify_on_pending: true          # keep video in outbox if credentials are missing

trend_discovery:
  queries:
    - "AI news today {month_year}"
    - "new AI model release announcement {month_year}"
    - "new AI tools and apps launched this week {month_year}"
    - "OpenAI Anthropic Google DeepMind Meta announcement {month_year}"
    - "AI startup funding and acquisition news {month_year}"
    - "make money with AI new tools and opportunities {month_year}"
  research_queries: 2              # verification searches per digest story
  history_file: state/history.json # topic memory to avoid repeats
